name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: resolve_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag was not resolved."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build CoreGaze (MinGW, static runtime)
        shell: pwsh
        run: |
          # Use the runner's MinGW-w64 ahead of other gcc copies on PATH (e.g. Strawberry Perl).
          # MinGW links the C++ runtime statically, so the installer needs no VC++ redistributable.
          $env:PATH = "C:\mingw64\bin;$env:PATH"
          g++ --version
          # The tag's version is stamped into the exe; build-installer.ps1 checks it matches.
          # Quote the whole -D argument: PowerShell otherwise splits "-DNAME=1.2.3" at the first dot.
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release "-DCOREGAZE_VERSION=${{ steps.resolve_tag.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version "${{ steps.resolve_tag.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: CoreGaze ${{ steps.resolve_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            build/installer/CoreGaze-Setup-*.exe
